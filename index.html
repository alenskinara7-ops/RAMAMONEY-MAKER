
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAMA MONEY MAKER</title>
	<link rel="stylesheet" href="style.css">
</head> 
<body>

    <h1>✈ RAMA MONEY MAKER</h1>
    <p>Fly high. Collect points. Have fun!</p>

    <div id="game">
        <h2 id="multiplier">1.00x</h2>
        <div id="plane">✈️</div>
        <p id="status">Ready for takeoff!</p>
    </div>

   
<div class="balance-card">
    <p>YOUR VIRTUAL BALANCE</p>
    <h2><span id="points">1000</span> <small>POINTS</small></h2>
    <p>Practice mode · No real money</p>
</div>

<div id="historyPanel">

<div id="leaderboard">
    <h2>🏆 LEADERBOARD</h2>

    <div class="leader-row">
        <span>🥇 Player One</span>
        <strong>2500 points</strong>
    </div>

    <div class="leader-row">
        <span>🥈 Player Two</span>
        <strong>1800 points</strong>
    </div>

    <div class="leader-row">
        <span>🥉 Player Three</span>
        <strong>1200 points</strong>
    </div>
</div>
    <h3>FLIGHT HISTORY</h3>
    <ul id="historyList">
        <li>No flights yet</li>
    </ul>
</div>
    <button id="startButton">START FLIGHT</button>
	<button id="soundButton">🔊 SOUND: ON</button>
<button id="cashOutButton" disabled>CASH OUT</button>n>
<script src="script.js"></script>
</body>
</html>
